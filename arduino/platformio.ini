; FasterEdge MCU (ESP32) — PlatformIO 配置
; 依赖：PubSubClient (MQTT)、Preferences 为 Arduino 内置
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

; 若使用 ESP32-S3 等变体，换 board 即可，代码通用
; [env:esp32s3]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = knolleary/PubSubClient@^2.8