; FasterEdge MCU (ESP32) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + ESP-IDF 框架」，与 arduino/（Arduino C++ 版）区分。
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 命令行:
;   pio run -d . && pio run -d . -t upload && pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -DESP32

; 若使用 ESP32-S3 / C3 等变体，换 board 即可，代码通用
; [env:esp32s3]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = espidf
; monitor_speed = 115200

; WiFi 连接（MQTT/SNTP 需要）：在下面填入 SSID/密码，或用
; idf.py menuconfig / sdkconfig 配置
; build_flags =
;     -DFE_WIFI_SSID=\"MySSID\"
;     -DFE_WIFI_PASS=\"MyPassword\"